server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jwt.private-key=classpath:keys/auth-private.pem
jwt.public-key=classpath:keys/auth-public.pem
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.jpa.open-in-view=false
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:30}
